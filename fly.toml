# Fly.io deploy for the Vyn Therapy API (Machines only — DB/Redis are external).
#
# Fly "free allowance" is gone; new orgs get a short trial only. To keep this
# cheap we do NOT run Postgres/Redis on Fly:
#   - Postgres: Neon free tier  -> set DATABASE_URL
#   - Redis:    Upstash free    -> set REDIS_URL
#   - Storage:  Cloudflare R2 (S3-compatible) -> S3_* (region "auto")
# (Fly Managed Postgres exists but starts at $38/mo; see fly.io/docs/mpg.)
#
# One-time setup (needs a Fly account with card verification):
#   fly auth signup
#   fly apps create vyn-api            # name must be globally unique
#   fly secrets set -a vyn-api \
#     DATABASE_URL="postgres://...neon.tech/vyn?sslmode=require" \
#     REDIS_URL="rediss://...upstash.io:6379" \
#     BETTER_AUTH_SECRET="$(node -p \"require('crypto').randomBytes(32).toString('base64')\")" \
#     BETTER_AUTH_URL="https://vyn-api.fly.dev" \
#     CORS_ORIGINS="https://vyn-therapy-admin.netlify.app,https://<pwa-origin>" \
#     S3_ENDPOINT="https://<accountid>.r2.cloudflarestorage.com" S3_REGION="auto" \
#     S3_ACCESS_KEY="..." S3_SECRET_KEY="..." \
#     S3_MEDIA_BUCKET="vyn-media" S3_PRODUCTS_BUCKET="vyn-products" \
#     S3_PUBLIC_BASE_URL="https://<your-r2-public-domain>" \
#     FLUTTERWAVE_PUBLIC_KEY="..." FLUTTERWAVE_SECRET_KEY="..." \
#     FLUTTERWAVE_LIVE="false" FLUTTERWAVE_REDIRECT_URL="https://vyn-api.fly.dev/v1/shop/payments/return" \
#     GROQ_API_KEY="..." QR_SECRET="..."
#   fly deploy
#
# NOTE: fly.toml `app` name must be globally unique; `fly launch` will
# offer an alternative if vyn-api is taken.
app = "vyn-api"
primary_region = "jnb"

[build]
  dockerfile = "services/api/Dockerfile"

[processes]
  # Dockerfile compiles the API at image build; just run the output.
  app = "node services/api/dist/index.js"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
