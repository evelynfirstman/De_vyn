name: vyn

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vyn
      POSTGRES_PASSWORD: vyn
      POSTGRES_DB: vyn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3mock:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"

  s3-init:
    image: alpine:latest
    depends_on:
      - s3mock
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "
      apk add --no-cache aws-cli >/dev/null;
      for i in 1 2 3 4 5 6 7 8; do
        aws --endpoint-url http://s3mock:9090 s3 ls >/dev/null 2>&1 && break || sleep 5;
      done;
      aws --endpoint-url http://s3mock:9090 s3 mb s3://vyn-media >/dev/null 2>&1;
      aws --endpoint-url http://s3mock:9090 s3 mb s3://vyn-products >/dev/null 2>&1;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://vyn:vyn@postgres:5432/vyn
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3mock:9090
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
