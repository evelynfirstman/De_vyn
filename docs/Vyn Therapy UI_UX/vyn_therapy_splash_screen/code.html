<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vyn Therapy - Splash Screen</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config Customization -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              deep: '#0B3D36',
              primary: '#12836F',
              accent: '#DCF2EA',
              highlight: '#F97316',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    };
  </script>
<!-- Custom Animations and Canvas Styles -->
<style data-purpose="custom-animations">
    @keyframes subtlePulse {
      0%, 100% {
        opacity: 0.85;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.02);
      }
    }
    .animate-subtle-pulse {
      animation: subtlePulse 3s ease-in-out infinite;
    }
    @keyframes progressSlide {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(30%);
      }
      100% {
        transform: translateX(110%);
      }
    }
    .animate-progress {
      animation: progressSlide 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    /* Ambient glow circles */
    .glow-radial-bg {
      background: radial-gradient(circle at 50% 40%, rgba(18, 131, 111, 0.35) 0%, rgba(11, 61, 54, 0) 70%);
    }
  </style>
</head>
<body class="bg-black text-slate-100 flex items-center justify-center min-h-screen font-sans selection:bg-[#12836F]/30 selection:text-white antialiased">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Container with mobile iOS proportions (390x844) -->
<div class="relative w-full max-w-[390px] h-[844px] overflow-hidden rounded-[50px] shadow-2xl border-[9px] border-[#18201E] flex flex-col justify-between bg-gradient-to-b from-[#0B3D36] via-[#0D4E45] to-[#12836F]" data-purpose="mobile-viewport">
<!-- Background Ambient Lighting Effect -->
<div aria-hidden="true" class="absolute inset-0 glow-radial-bg pointer-events-none"></div>
<!-- BEGIN: iOSStatusBar -->
<!-- Top Mobile iOS Status Bar -->
<header class="relative z-20 pt-3.5 px-8 flex justify-between items-center text-white" data-purpose="ios-status-bar">
<!-- iOS Clock Time -->
<span class="text-[15px] font-semibold tracking-tight text-white/95">9:41</span>
<!-- Dynamic Island / Speaker Notch Indicator -->
<div class="w-24 h-4 bg-black/40 backdrop-blur-md rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
<!-- Status Icons (Signal, Wifi, Battery) -->
<div class="flex items-center space-x-2 text-white/90">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 16 16">
<rect height="4" rx="0.5" width="2" x="1" y="10"></rect>
<rect height="6" rx="0.5" width="2" x="4.5" y="8"></rect>
<rect height="8.5" rx="0.5" width="2" x="8" y="5.5"></rect>
<rect height="11" rx="0.5" width="2" x="11.5" y="3"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 16.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm-4.243-4.243a6 6 0 018.486 0 .75.75 0 001.06-1.06 7.5 7.5 0 00-10.606 0 .75.75 0 001.06 1.06zm-2.828-2.828a10 10 0 0114.142 0 .75.75 0 001.06-1.06 11.5 11.5 0 00-16.262 0 .75.75 0 001.06 1.06z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-6 h-[11px] border border-white/80 rounded-[3px] p-[1.5px] flex items-center">
<div class="h-full w-full bg-white rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-[4px] bg-white/80 rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: BrandCenterSection -->
<!-- Centered Brand Identity & Proposition -->
<main class="relative z-10 flex flex-col items-center justify-center flex-1 px-8 text-center -mt-6" data-purpose="brand-presentation">
<!-- Logo Container with Soft Shadow & Ambient Bloom -->
<div class="relative mb-6 group cursor-default">
<!-- Diffuse colored ambient halo behind logo -->
<div class="absolute -inset-2 bg-[#DCF2EA]/20 rounded-3xl blur-xl transition-all duration-700"></div>
<!-- Provided Brand Logo SVG Component -->
<div class="relative w-28 h-28 drop-shadow-2xl animate-subtle-pulse transition-transform duration-500">
<svg class="rounded-3xl shadow-inner" fill="none" height="100%" viewbox="0 0 120 120" width="100%" xmlns="http://www.w3.org/2000/svg">
<rect fill="#0B3D36" height="120" rx="28" width="120"></rect>
<path d="M34 40L60 84L86 40" stroke="#DCF2EA" stroke-linecap="round" stroke-linejoin="round" stroke-width="10"></path>
<path d="M46 40L60 66L74 40" stroke="#12836F" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
<circle cx="60" cy="30" fill="#F97316" r="5"></circle>
</svg>
</div>
</div>
<!-- Brand Wordmark & Subtitle -->
<div class="space-y-1">
<h1 class="text-4xl font-extrabold tracking-tight text-white flex items-center justify-center gap-2">
<span>Vyn</span>
<span class="text-[#DCF2EA] font-light tracking-wide text-3xl opacity-90">Therapy</span>
</h1>
<div class="h-0.5 w-10 bg-[#DCF2EA]/30 mx-auto rounded-full mt-2"></div>
</div>
<!-- Value Proposition / Tagline -->
<p class="mt-4 text-[#DCF2EA]/90 text-[15px] font-normal leading-relaxed max-w-[270px] drop-shadow-sm">
        AI-Powered Physical Recovery for Desk Professionals
      </p>
<!-- Clinically Endorsed Micro Badge -->
<div class="mt-5 inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/15">
<svg class="w-3.5 h-3.5 text-[#DCF2EA]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
<span class="text-[11px] font-medium tracking-wide text-[#DCF2EA] uppercase">Clinical AI Core</span>
</div>
</main>
<!-- END: BrandCenterSection -->
<!-- BEGIN: FooterStatusSection -->
<!-- Bottom Interactive & Diagnostic Loading Area -->
<footer class="relative z-10 pb-8 px-6 flex flex-col items-center text-center space-y-4" data-purpose="initialization-indicator">
<!-- Sleek Loading Bar Indicator Container -->
<div class="w-48 flex flex-col items-center space-y-2.5">
<!-- Animated Track Bar -->
<div class="w-full h-1 bg-white/15 rounded-full overflow-hidden relative backdrop-blur-sm">
<div class="absolute inset-y-0 w-24 bg-gradient-to-r from-transparent via-[#DCF2EA] to-transparent rounded-full animate-progress"></div>
</div>
<!-- Live Loading Status Text -->
<div class="flex items-center space-x-1.5">
<!-- Small pulsating status dot -->
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#DCF2EA] opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-[#DCF2EA]"></span>
</span>
<span class="text-[13px] font-medium text-[#DCF2EA]/85 tracking-normal">
            Initializing clinical biometrics...
          </span>
</div>
</div>
<!-- App Build Version & Clinical Validation Badge -->
<div class="pt-1">
<p class="text-[11px] font-medium text-white/50 tracking-wider">
          v4.18 · Clinically Validated
        </p>
</div>
<!-- iOS Bottom Home Indicator Bar -->
<div aria-hidden="true" class="w-32 h-1 bg-white/40 rounded-full pt-[1px] mt-1"></div>
</footer>
<!-- END: FooterStatusSection -->
</div>
<!-- END: MobileDeviceContainer -->
</body></html>
